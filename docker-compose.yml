services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: demoapi_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - app-network

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoapi_app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=mydatabase;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    ports:
      - "5091:8080"
    depends_on:
      - sqlserver
    networks:
      - app-network

volumes:
  sql_data:

networks:
  app-network:
    driver: bridge
